[build]
  # Ausgeliefert wird NUR dist/ (scripts/build-public.mjs, Positivliste). Bis 03.11.2026 war die
  # Repo-Wurzel Publish-Ordner und Repo-Interna waren öffentlich.
  command = "node scripts/build-public.mjs"
  publish = "dist"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/ebook"
  to = "/ebook.html"
  status = 200

[[redirects]]
  from = "/book"
  to = "/ebook.html"
  status = 301
